name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (serve + dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[serve,dev]"

      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Mypy
        run: |
          set +e
          mypy --no-pretty > mypy.txt 2>&1
          status=$?
          cat mypy.txt
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import re

          lines = [line.rstrip() for line in open("mypy.txt", encoding="utf-8")]
          shown = 0
          for line in lines:
              match = re.match(r"^(.+?):(\d+): error: (.+)$", line)
              if match and shown < 50:
                  print(f"::error file={match.group(1)},line={match.group(2)}::{match.group(3)}")
                  shown += 1
          if shown == 0:
              raw = " | ".join(lines[:20])[:3000]
              print(f"::error file=.github/workflows/ci.yml,line=1::mypy exit {status}: {raw}")
          PY
            exit 1
          fi

      - name: Pytest
        run: |
          set +e
          pytest --cov=sichuan_speech --cov-report=term-missing > pytest.txt 2>&1
          status=$?
          cat pytest.txt
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import re

          lines = [line.rstrip() for line in open("pytest.txt", encoding="utf-8")]
          shown = 0
          for line in lines:
              match = re.match(r"^(?:FAILED|ERROR) ([^:\s]+)(?:::\S+)?(?: - (.*))?$", line)
              if match and shown < 50:
                  reason = match.group(2) or line
                  print(f"::error file={match.group(1)},line=1::{reason}")
                  shown += 1
          if shown == 0:
              raw = " | ".join(lines[-30:])[:3000]
              print(f"::error file=.github/workflows/ci.yml,line=1::pytest exit {status}: {raw}")
          PY
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Check wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("sichuan_speech/web/index.html") for n in names), names
          assert any(n.endswith("sichuan_speech/py.typed") for n in names), names
          print("wheel ok:", wheel, len(names), "entries")
          PY
