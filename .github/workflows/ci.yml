name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (serve + dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[serve,dev]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest --cov=sichuan_speech --cov-report=term-missing

      - name: Build sdist + wheel
        run: python -m build

      - name: Check wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("sichuan_speech/web/index.html") for n in names), names
          assert any(n.endswith("sichuan_speech/py.typed") for n in names), names
          print("wheel ok:", wheel, len(names), "entries")
          PY
